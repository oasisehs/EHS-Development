<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EHS Suite - Employee Lifecycle</title>
    <link rel="stylesheet" href="dashboard.css" />
    <style>
        .screen-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .screen-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
        .screen-header h1 { font-size: 28px; color: var(--primary-dark); margin: 0; }
        .chip-link { text-decoration: none; color: var(--primary-dark); border: 1px solid var(--border-color); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
        .stat { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; box-shadow: var(--shadow-sm); padding: 14px; }
        .stat p { font-size: 12px; color: var(--text-light); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .5px; }
        .stat h3 { margin: 0; font-size: 24px; color: var(--primary-dark); }
        .panel { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 14px; }
        .controls { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; }
        .controls input, .controls select { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; font-size: 14px; width: 100%; }
        .controls button { border: none; background: var(--primary-dark); color: #fff; border-radius: 8px; padding: 10px 12px; cursor: pointer; font-weight: 600; }
        .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .employee-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; background: #fff; }
        .employee-card h3 { margin: 0 0 4px; font-size: 17px; color: var(--text-dark); }
        .employee-card .meta { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
        .row { font-size: 13px; margin-bottom: 6px; color: var(--text-dark); }
        .status-pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
        .status-pill.active { background: #ecfdf5; color: #065f46; }
        .status-pill.on_leave { background: #fff7ed; color: #9a3412; }
        .status-pill.inactive { background: #eff6ff; color: #1e40af; }
        .status-pill.terminated { background: #fef2f2; color: #991b1b; }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .card-actions button { border: 1px solid var(--border-color); background: #fff; border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
        .pagination-text { font-size: 12px; color: var(--text-light); }
        .pagination-controls { display: flex; gap: 8px; }
        .pagination-btn { border: 1px solid var(--border-color); background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .pagination-btn:disabled { opacity: .5; cursor: not-allowed; }
        .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .quick-actions a { text-decoration: none; border: 1px solid var(--border-color); color: var(--text-dark); padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .controls { grid-template-columns: 1fr; }
        }
        @media (max-width: 680px) {
            .cards { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="screen-wrap">
        <div class="screen-header">
            <div>
                <h1>Employee Lifecycle Portal</h1>
                <p>Directory, compliance status, and training quick actions.</p>
            </div>
            <div>
                <a class="chip-link" href="dashboard.html">Back to Dashboard</a>
                <a class="chip-link" href="onboarding.html">Onboarding Wizard</a>
            </div>
        </div>

        <div class="stats-grid">
            <section class="stat"><p>Total Employees</p><h3 id="totalEmployees">0</h3></section>
            <section class="stat"><p>Active</p><h3 id="activeEmployees">0</h3></section>
            <section class="stat"><p>On Leave</p><h3 id="onLeaveEmployees">0</h3></section>
            <section class="stat"><p>Compliance Avg</p><h3 id="complianceAverage">0%</h3></section>
        </div>

        <section class="panel">
            <div class="controls">
                <input id="employeeSearch" placeholder="Search by name, email, title" />
                <select id="employeeDeptFilter" title="Department filter"><option value="">All Departments</option></select>
                <select id="employeeStatusFilter" title="Status filter">
                    <option value="">All Statuses</option>
                    <option value="active">active</option>
                    <option value="on_leave">on_leave</option>
                    <option value="inactive">inactive</option>
                    <option value="terminated">terminated</option>
                </select>
                <button id="applyEmployeeFiltersBtn" type="button">Apply</button>
            </div>
            <div class="quick-actions">
                <a href="training.html">Assign Training</a>
                <a href="operations.html">View Compliance</a>
                <a href="onboarding.html">Start Onboarding</a>
                <a href="documents.html">Open Documents</a>
            </div>
        </section>

        <section class="panel">
            <div id="employeeCards" class="cards"></div>
            <div class="pagination">
                <span id="employeePaginationText" class="pagination-text">Page 1 of 1</span>
                <div class="pagination-controls">
                    <button id="employeePrevBtn" class="pagination-btn" type="button">Previous</button>
                    <button id="employeeNextBtn" class="pagination-btn" type="button">Next</button>
                </div>
            </div>
        </section>
    </div>

    <script src="employees.js"></script>
</body>
</html>
