<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Database Inspector | EHSSuite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .subtitle {
            color: #666;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 12px;
        }

        .status-badge.connected {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        .sidebar-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .sidebar-section-title:first-child {
            margin-top: 0;
        }

        .table-list {
            list-style: none;
        }

        .table-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #f8f9fa;
            border-left: 3px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-item:hover {
            background: #e9ecef;
            border-left-color: #667eea;
        }

        .table-item.active {
            background: #667eea;
            color: white;
            border-left-color: #667eea;
        }

        .row-count {
            font-size: 11px;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .table-item.active .row-count {
            background: rgba(255, 255, 255, 0.2);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .content-area {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-header h2 {
            font-size: 18px;
            color: #333;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .info-label {
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .content-body {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .schema-info {
            margin-bottom: 20px;
        }

        .schema-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .schema-table th,
        .schema-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        .schema-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .schema-table td {
            color: #666;
        }

        .schema-table code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            max-height: 600px;
            overflow: auto;
        }

        .data-table th,
        .data-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .data-table td {
            color: #666;
            font-family: 'Courier New', monospace;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            align-items: center;
        }

        .pagination button {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            flex: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .query-editor {
            display: none;
        }

        .query-editor.show {
            display: block;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 150px;
        }

        .logout-btn {
            margin-left: auto;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .status-badge {
                margin-left: 0;
                margin-top: 10px;
                display: block;
                width: fit-content;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1>
                        🔍 Database Inspector
                        <span class="status-badge connected" id="statusBadge">Checking...</span>
                    </h1>
                    <p class="subtitle">View and manage Render Postgres database tables and data</p>
                </div>
                <button class="btn-danger logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-section-title">Database</div>
                <div id="connectionInfo" style="font-size: 12px; color: #666;"></div>

                <div class="sidebar-section-title">Tables</div>
                <ul class="table-list" id="tableList"></ul>

                <div class="sidebar-section-title">Actions</div>
                <div class="action-buttons">
                    <button class="btn-primary" onclick="toggleQueryEditor()">📝 Query</button>
                    <button class="btn-primary" onclick="seedDatabase()">🌱 Seed</button>
                </div>
            </div>

            <div class="content-area">
                <div class="content-header">
                    <div>
                        <h2 id="selectedTable">Select a table to view</h2>
                        <div class="info-grid" id="tableInfo"></div>
                    </div>
                </div>

                <div class="content-body">
                    <div class="error-message" id="errorMessage"></div>
                    <div class="success-message" id="successMessage"></div>

                    <div class="query-editor" id="queryEditor">
                        <h3 style="margin-bottom: 12px;">Execute Query (SELECT only)</h3>
                        <textarea id="queryInput" placeholder="SELECT * FROM users LIMIT 10;"></textarea>
                        <div style="display: flex; gap: 10px; margin-top: 12px;">
                            <button class="btn-primary" onclick="executeQuery()">Execute</button>
                            <button class="btn-primary" onclick="toggleQueryEditor()" style="background: #6c757d;">Cancel</button>
                        </div>
                    </div>

                    <div id="mainContent">
                        <p style="color: #999; text-align: center; padding: 40px;">Select a table from the left to view its data</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin-db-inspect.js"></script>
</body>
</html>
