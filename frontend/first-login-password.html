<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHSSuite - First Login Password Update</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .hidden {
            display: none;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%231e5a96'/></svg>">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="branding-section">
                <div class="logo-wrapper">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 7v5m0 4v0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 class="brand-title">EHSSuite</h1>
                <p class="brand-subtitle">First login security setup</p>
            </div>

            <div class="features-section">
                <div class="feature-item">
                    <div class="feature-icon">🔐</div>
                    <div class="feature-text">
                        <h3>Set Your Own Password</h3>
                        <p>Your temporary password must be replaced before accessing the dashboard.</p>
                    </div>
                </div>

                <div class="feature-item">
                    <div class="feature-icon">🛡️</div>
                    <div class="feature-text">
                        <h3>Security First</h3>
                        <p>Use a strong password with uppercase, lowercase, and numbers.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="login-form-wrapper">
                <h2>Update Password</h2>
                <p class="login-subtitle">Required on first login</p>

                <form id="firstLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
                        </div>
                        <span class="error-message" id="newPasswordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>

                    <button type="submit" class="login-btn" id="firstLoginSubmitBtn">
                        <span>Update Password</span>
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </button>

                    <div class="error-alert hidden" id="generalError"></div>
                    <div class="success-alert hidden" id="successMessage"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="first-login-password.js"></script>
</body>
</html>
